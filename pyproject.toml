[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-botkit-starter"
version = "0.2.0"
description = "A generic Telegram bot starter with durable tasks, pluggable handlers and offline demo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
botkit = "botkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
